# BGM Agent — Alembic 迁移配置
#
# 数据库 URL 不在此文件中硬编码，由 env.py 从项目 Settings 读取。
# 使用方法:
#   cd 到项目根目录，运行:
#   alembic -c database/migrations/alembic.ini upgrade head
#   alembic -c database/migrations/alembic.ini revision --autogenerate -m "..."
#   alembic -c database/migrations/alembic.ini current

[alembic]
# 迁移脚本所在目录（%(here)s = 此 ini 文件所在目录）
script_location = %(here)s

# 将项目根目录加入 sys.path
prepend_sys_path = .

# 迁移文件命名模板
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# 版本文件目录（%(here)s = database/migrations/）
version_locations = %(here)s/versions

path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
