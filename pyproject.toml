[project]
name = "bgm-agent"
version = "0.1.1"
description = "Bangumi 本机共读 Agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.28.0",
  "requests>=2.32.0",
  "openai>=1.0",
  "langchain-core>=1.0.0",
  "langchain-openai>=1.0.0",
  "langgraph>=1.0.0",
  "tiktoken>=0.9.0",
  "python-dotenv>=1.0",
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
]

[project.optional-dependencies]
local-data = ["sqlalchemy>=2.0,<2.1", "sqlmodel>=0.0.22", "psycopg2-binary>=2.9.10", "pgvector>=0.3.0", "alembic>=1.13", "zai-sdk>=0.0.4"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0", "pytest-mock>=3.14.0"]

[tool.uv]
package = false
